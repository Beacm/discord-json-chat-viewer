<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversación de Discord - Volatility 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1e1e2e;
            color: #cdd6f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #313244;
            border-radius: 10px;
            padding: 20px;
        }
        h1 {
            color: #89b4fa;
            text-align: center;
            font-size: 20px;
        }
        p {
            padding: 8px;
            border-bottom: 1px solid #45475a;
            margin: 0;
        }
        textarea {
            width: 100%;
            height: 150px;
            font-family: monospace;
            background-color: #1e1e2e;
            color: #cdd6f4;
            border: 1px solid #45475a;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        button {
            background-color: #89b4fa;
            color: #1e1e2e;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #b4befe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Conversación de Discord - Volatility 3</h1>
        
        <textarea id="jsonInput" placeholder='Pega aquí el JSON obtenido con:
sudo vol -f memoria.dmp windows.discord.Discord'></textarea>
        
        <button onclick="cargarConversacion()">Mostrar conversación</button>
        
        <div id="conversacion">
            <p style="color: #a6adc8; text-align: center;">Pega el JSON y presiona el botón</p>
        </div>
    </div>

    <script>
        function printConversation(conversationContainerNode, discordConversationJSON) {
            // Vaciar el contenedor
            conversationContainerNode.innerHTML = "";
            
            // Parsear el JSON y revertir (antiguo a nuevo)
            const discordConversationArray = JSON.parse(discordConversationJSON).reverse();
            
            for (let i = 0; i < discordConversationArray.length; i++) {
                let newParagraph = document.createElement("p");
                
                let messageDate = new Date(discordConversationArray[i].timestamp);
                let newContent = document.createTextNode(
                    "[" + messageDate.toLocaleString() + "] " +
                    discordConversationArray[i].author.username + ": " +
                    discordConversationArray[i].content
                );
                
                newParagraph.appendChild(newContent);
                conversationContainerNode.appendChild(newParagraph);
            }
        }

        function cargarConversacion() {
            const jsonText = document.getElementById("jsonInput").value;
            const container = document.getElementById("conversacion");
            
            if (jsonText.trim() === "") {
                container.innerHTML = "<p style='color: #f38ba8;'>❌ Error: No se ha pegado ningún JSON</p>";
                return;
            }
            
            try {
                printConversation(container, jsonText);
            } catch (error) {
                container.innerHTML = "<p style='color: #f38ba8;'>❌ Error al procesar JSON: " + error.message + "</p>";
            }
        }
    </script>
</body>
</html>
